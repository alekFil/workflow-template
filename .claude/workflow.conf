# Workflow settings. Read by skills and by .claude/scripts/workflow.sh.
# Shell syntax: KEY=value, no spaces around "=".

# Profile: project (code and context in one repository), own-oss or contribution
# (devmeta: this private repository holds the context, the code lives in CODE_DIR).
PROFILE=project

# Branch model: trunk (main + feature/*) or dev (main + dev + feature/* + hotfix/*).
BRANCH_MODEL=dev

# How a task branch is integrated: local (rebase + ff-only merge on this machine)
# or pr (push the task branch and open a pull request; people merge it).
MERGE_MODE=local

# Code repository relative to this directory: "." or "code" (devmeta profiles).
CODE_DIR=.

# Devmeta profiles: clone URL of the code repository (own public repo or your fork),
# and for a contribution the original repository and its default branch.
CODE_REPO=
UPSTREAM_REPO=
UPSTREAM_BRANCH=

# Where ADRs live: docs/decisions, code/docs/decisions (own OSS) or none.
DECISIONS_DIR=docs/decisions

# Product description: docs/product.md or none (contribution profile).
PRODUCT_FILE=docs/product.md

# Task cards.
TASKS_DIR=.context/tasks
